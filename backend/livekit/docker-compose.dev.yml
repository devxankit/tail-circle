# LiveKit in dev mode — local verification only.
#
#   cd backend/livekit
#   docker compose -f docker-compose.dev.yml up -d
#
# Uses the published `devkey / secret` pair and no TLS, which is exactly what
# the API's production config guard refuses to boot with. Good enough to
# exercise the full ring → accept → two-way video flow between two browser tabs
# on this machine; proves nothing about NAT traversal on real networks.
#
# Ports default to the standard ones but honour the same .env as production, so
# a port change is made in one place. Match them in backend/.env:
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=secret
#   LIVEKIT_URL=ws://localhost:7880          ← update if LIVEKIT_PORT changes
#   LIVEKIT_HTTP_URL=http://localhost:7880
# and frontend/.env:
#   VITE_LIVEKIT_URL=ws://localhost:7880

services:
  livekit-dev:
    image: livekit/livekit-server:v1.13
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    environment:
      # --dev supplies devkey/secret; these only move the ports.
      LIVEKIT_PORT: ${LIVEKIT_PORT:-7880}
      LIVEKIT_RTC_TCP_PORT: ${LIVEKIT_RTC_TCP_PORT:-7881}
      LIVEKIT_RTC_PORT_RANGE_START: ${LIVEKIT_RTC_PORT_RANGE_START:-50000}
      LIVEKIT_RTC_PORT_RANGE_END: ${LIVEKIT_RTC_PORT_RANGE_END:-50100}
    ports:
      - "${LIVEKIT_PORT:-7880}:${LIVEKIT_PORT:-7880}"                  # signalling (WS + HTTP)
      - "${LIVEKIT_RTC_TCP_PORT:-7881}:${LIVEKIT_RTC_TCP_PORT:-7881}"  # RTC over TCP
      - "${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}:${LIVEKIT_RTC_PORT_RANGE_START:-50000}-${LIVEKIT_RTC_PORT_RANGE_END:-50100}/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LIVEKIT_PORT:-7880}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
