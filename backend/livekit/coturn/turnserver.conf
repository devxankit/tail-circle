# coturn — TURN/STUN relay for TailCircle video consultations.
#
# Why this exists: a plain WebRTC connection needs a direct UDP path between the
# two peers' networks. Indian mobile carriers and clinic Wi-Fi routinely sit
# behind symmetric NAT or block UDP entirely, and those calls connect at the
# signalling layer but carry no media. TURN relays the media through the server
# so the call still works.
#
# ⚠ coturn does NOT expand ${VAR} in this file. Deployment-specific values —
#   ports, realm, external IP, auth secret — are passed as CLI flags by
#   docker-compose.livekit.yml, which override the same keys here:
#
#     --listening-port      TURN_PORT
#     --tls-listening-port  TURN_TLS_PORT
#     --min-port            TURN_MIN_PORT
#     --max-port            TURN_MAX_PORT
#     --realm / --server-name   TURN_DOMAIN
#     --external-ip         TURN_PUBLIC_IP
#     --static-auth-secret  TURN_SECRET
#
#   The values below are the defaults used when a flag is not supplied.

listening-port=3478
tls-listening-port=5349

# Bind all interfaces; the firewall is the access control.
listening-ip=0.0.0.0

# Relay port range — must be open in the firewall.
min-port=49160
max-port=49200

# Time-limited credential mechanism (RFC 5766 §10.2): the backend derives a
# short-lived username/password pair from the shared secret, so no long-lived
# TURN account exists to leak. Supplied via --static-auth-secret.
use-auth-secret

# TLS for networks that block plain UDP/TCP TURN. Certificate paths are
# templated at install time — see README.md.
cert=/etc/letsencrypt/live/CHANGEME_TURN_DOMAIN/fullchain.pem
pkey=/etc/letsencrypt/live/CHANGEME_TURN_DOMAIN/privkey.pem

# ── Hardening ────────────────────────────────────────────────────────────
# An open relay is abused within hours of being discovered. These denials stop
# the relay being used to reach private networks or loopback services.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user throughput and session caps.
user-quota=12
total-quota=1200
max-bps=1000000

# CLI admin interface off — one less listener to secure.
no-cli
# Deprecated/insecure mechanisms.
no-tlsv1
no-tlsv1_1

fingerprint
stale-nonce=600

log-file=stdout
simple-log
