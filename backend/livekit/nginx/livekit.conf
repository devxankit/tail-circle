# nginx — TLS termination for the LiveKit signalling port.
#
# Only the signalling WebSocket (LIVEKIT_PORT) is proxied. Media never passes
# through nginx: it goes straight to LiveKit over the UDP range
# (LIVEKIT_RTC_PORT_RANGE_START..END) and TCP (LIVEKIT_RTC_TCP_PORT), or via
# coturn. Proxying media here would defeat the point of an SFU.
#
# ⚠ nginx does NOT expand ${VAR} in its config. The placeholders below are
#   substituted at install time from backend/livekit/.env:
#
#     cd backend/livekit
#     set -a && . ./.env && set +a
#     envsubst '$LIVEKIT_DOMAIN $LIVEKIT_PORT' \
#       < nginx/livekit.conf > /etc/nginx/sites-available/livekit
#     ln -sf /etc/nginx/sites-available/livekit /etc/nginx/sites-enabled/
#     certbot --nginx -d "$LIVEKIT_DOMAIN"
#     nginx -t && systemctl reload nginx
#
#   Naming only these two variables keeps envsubst from eating nginx's own
#   $host / $remote_addr / $http_upgrade.
#
# Re-run this whenever LIVEKIT_PORT or LIVEKIT_DOMAIN changes — nginx must
# proxy to the same port LiveKit is bound to.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ${LIVEKIT_DOMAIN};

    # ACME challenges stay on HTTP; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${LIVEKIT_DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${LIVEKIT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${LIVEKIT_DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # LiveKit does its own origin checking via the signed token; a token is
    # useless without the API secret, so CORS is not the security boundary here.
    location / {
        proxy_pass http://127.0.0.1:${LIVEKIT_PORT};

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A consultation WebSocket is idle-but-open for long stretches while
        # media flows out of band. The default 60s timeout would tear the
        # signalling channel down mid-call, so allow a full consult plus overage.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 15s;

        # Streaming, not batching.
        proxy_buffering off;
    }
}
